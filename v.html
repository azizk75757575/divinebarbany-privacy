<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProofSpot Verifier</title>
<meta name="description" content="Check a ProofSpot proof code: the signed time and place of a photo, verified in your browser.">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --text: #0f1714; --muted: #5b6863; --line: #dfe5e2;
    --ok: #12985a; --ok-bg: #e5f6ed; --bad: #c8322b; --bad-bg: #fbe9e8; --warn: #b26b00; --warn-bg: #fff2dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0e13; --card: #131921; --text: #eef2f1; --muted: #98a3a0; --line: #26303a;
      --ok: #3ad17c; --ok-bg: #0f2a1d; --bad: #ff6b63; --bad-bg: #2d1514; --warn: #ffb52e; --warn-bg: #2d2210;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  header svg { width: 34px; height: 34px; flex: none; }
  header b { font-size: 19px; letter-spacing: .2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .verdict { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 14px; margin-bottom: 18px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.bad { background: var(--bad-bg); color: var(--bad); }
  .verdict.none { background: var(--warn-bg); color: var(--warn); }
  .verdict .icon { font-size: 30px; line-height: 1; }
  .verdict h1 { font-size: 19px; margin: 0 0 4px; }
  .verdict p { margin: 0; color: var(--text); opacity: .85; font-size: 14.5px; }
  dl { margin: 0; display: grid; gap: 12px; }
  dt { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; white-space: pre-line; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tag { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); margin-top: 4px; }
  a { color: var(--ok); }
  .note { font-size: 13.5px; color: var(--muted); margin-top: 18px; }
  footer { font-size: 12.5px; color: var(--muted); margin-top: 22px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b2a22"/><path d="M32 12c-8.3 0-15 6.5-15 14.6C17 37.5 32 52 32 52s15-14.5 15-25.4C47 18.5 40.3 12 32 12z" fill="#f7faf8"/><circle cx="32" cy="27" r="9.5" fill="#33d17a"/><path d="M27.5 27.2l3.2 3.3 6-6.6" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <b>ProofSpot</b>
  </header>
  <div class="card" id="out"></div>
  <p class="note" id="note"></p>
  <footer id="foot"></footer>
</main>
<script>
(function () {
  "use strict";
  var L = {
    en: {
      checking: "Checking…",
      ok: "Valid signature", okText: "This time and place were signed by a ProofSpot iPhone at the moment of capture and have not been changed.",
      bad: "Signature does not match", badText: "This proof code was altered or damaged. Do not trust the date and place printed on the photo.",
      none: "No proof code", noneText: "Open this page by scanning the QR code on a ProofSpot photo.",
      unsupported: "This browser cannot check signatures. Try another browser, or the ProofSpot app.",
      time: "Signed time", utc: "UTC", position: "Signed position", accuracy: "accuracy", heading: "Camera facing",
      code: "Proof code", device: "Signing iPhone (Proof ID)", manual: "Location entered manually, not from GPS",
      noLoc: "No GPS fix at capture", video: "Video record", map: "Open the map",
      note: "Check that the proof code printed under the QR code on the photo is the same as above. To also compare the picture itself with what was signed, open the photo in the ProofSpot app → Verify.",
      foot: "Checked in your browser. The code after # never leaves this page."
    },
    ar: {
      checking: "جارٍ التحقق…",
      ok: "توقيع صحيح", okText: "هذا الوقت والمكان وقّعهما آيفون يستخدم ProofSpot لحظة الالتقاط ولم يتغيرا.",
      bad: "التوقيع غير مطابق", badText: "تم تغيير رمز الإثبات هذا أو تلفه. لا تثق بالتاريخ والمكان المطبوعين على الصورة.",
      none: "لا يوجد رمز إثبات", noneText: "افتح هذه الصفحة بمسح رمز QR الموجود على صورة ProofSpot.",
      unsupported: "هذا المتصفح لا يستطيع التحقق من التوقيعات. جرّب متصفحًا آخر أو تطبيق ProofSpot.",
      time: "الوقت الموقّع", utc: "UTC", position: "الموضع الموقّع", accuracy: "الدقة", heading: "اتجاه الكاميرا",
      code: "رمز الإثبات", device: "الآيفون الموقِّع (معرّف الإثبات)", manual: "موقع مُدخل يدويًا، ليس من GPS",
      noLoc: "لم يكن هناك تحديد GPS عند الالتقاط", video: "تسجيل فيديو", map: "افتح الخريطة",
      note: "تأكد أن رمز الإثبات المطبوع تحت رمز QR على الصورة هو نفسه الظاهر أعلاه. ولمقارنة الصورة نفسها بما تم توقيعه، افتحها في تطبيق ProofSpot ← تحقّق.",
      foot: "يتم التحقق داخل متصفحك. الرمز بعد # لا يغادر هذه الصفحة."
    },
    fr: {
      checking: "Vérification…",
      ok: "Signature valide", okText: "Cette heure et ce lieu ont été signés par un iPhone ProofSpot au moment de la prise et n'ont pas été modifiés.",
      bad: "La signature ne correspond pas", badText: "Ce code de preuve a été modifié ou abîmé. Ne vous fiez pas à la date et au lieu imprimés sur la photo.",
      none: "Aucun code de preuve", noneText: "Ouvrez cette page en scannant le QR code d'une photo ProofSpot.",
      unsupported: "Ce navigateur ne peut pas vérifier les signatures. Essayez un autre navigateur ou l'app ProofSpot.",
      time: "Heure signée", utc: "UTC", position: "Position signée", accuracy: "précision", heading: "Orientation de l'appareil",
      code: "Code de preuve", device: "iPhone signataire (ID de preuve)", manual: "Position saisie manuellement, pas par GPS",
      noLoc: "Pas de position GPS à la prise", video: "Enregistrement vidéo", map: "Ouvrir la carte",
      note: "Vérifiez que le code de preuve imprimé sous le QR code de la photo est le même que ci-dessus. Pour comparer aussi l'image avec ce qui a été signé, ouvrez la photo dans l'app ProofSpot → Vérifier.",
      foot: "Vérifié dans votre navigateur. Le code après # ne quitte jamais cette page."
    }
  };
  var lang = (navigator.language || "en").slice(0, 2);
  if (!L[lang]) lang = "en";
  var t = L[lang];
  document.documentElement.lang = lang;
  if (lang === "ar") document.documentElement.dir = "rtl";
  var out = document.getElementById("out");
  document.getElementById("foot").textContent = t.foot;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function verdict(kind, title, text) {
    var v = el("div", "verdict " + kind);
    v.appendChild(el("div", "icon", kind === "ok" ? "✔" : (kind === "bad" ? "✖" : "?")));
    var box = el("div"); box.appendChild(el("h1", null, title)); box.appendChild(el("p", null, text)); v.appendChild(box);
    return v;
  }
  function b64url(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  var ALPHA = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
  function base32(bytes) {
    var out = "", buf = 0, bits = 0;
    for (var i = 0; i < bytes.length; i++) { buf = (buf << 8) | bytes[i]; bits += 8; while (bits >= 5) { out += ALPHA[(buf >>> (bits - 5)) & 31]; bits -= 5; } buf &= (1 << bits) - 1; }
    if (bits > 0) out += ALPHA[(buf << (5 - bits)) & 31];
    return out;
  }
  function group(s, n) { var r = ""; for (var i = 0; i < s.length; i++) { if (i && i % n === 0) r += "-"; r += s[i]; } return r; }
  function u16(a, o) { return (a[o] << 8) | a[o + 1]; }
  function u32(a, o) { return ((a[o] << 24) >>> 0) + (a[o + 1] << 16) + (a[o + 2] << 8) + a[o + 3]; }
  function i32(a, o) { var v = u32(a, o); return v > 0x7fffffff ? v - 0x100000000 : v; }
  function toBig(bytes) { var h = "0x"; for (var i = 0; i < bytes.length; i++) h += bytes[i].toString(16).padStart(2, "0"); return BigInt(h); }
  function toBytes(n) { var h = n.toString(16).padStart(64, "0"), a = new Uint8Array(32); for (var i = 0; i < 32; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function modpow(b, e, m) { var r = 1n; b %= m; while (e > 0n) { if (e & 1n) r = (r * b) % m; b = (b * b) % m; e >>= 1n; } return r; }
  // P-256 point decompression (y² = x³ − 3x + b mod p; p ≡ 3 mod 4).
  function decompress(c) {
    var p = BigInt("0xffffffff00000001000000000000000000000000ffffffffffffffffffffffff");
    var b = BigInt("0x5ac635d8aa3a93e7b3ebbd55769886bc651d06b0cc53b0f63bce3c3e27d2604b");
    var x = toBig(c.slice(1, 33));
    var y2 = ((x * x % p) * x - 3n * x + b) % p; if (y2 < 0n) y2 += p;
    var y = modpow(y2, (p + 1n) / 4n, p);
    if ((y & 1n) !== BigInt(c[0] & 1)) y = p - y;
    var raw = new Uint8Array(65); raw[0] = 4; raw.set(c.slice(1, 33), 1); raw.set(toBytes(y), 33);
    return raw;
  }
  function row(dl, label, value, mono) {
    dl.appendChild(el("dt", null, label));
    var dd = el("dd", mono ? "mono" : null); if (typeof value === "string") dd.textContent = value; else dd.appendChild(value);
    dl.appendChild(dd);
  }
  function deg(v, pos, neg) { return Math.abs(v).toFixed(6) + "° " + (v >= 0 ? pos : neg); }

  async function run() {
    var hash = location.hash.slice(1);
    if (!hash) { out.appendChild(verdict("none", t.none, t.noneText)); return; }
    var data;
    try { data = b64url(hash); } catch (e) { data = null; }
    if (!data || data.length !== 151 || data[0] !== 1) { out.appendChild(verdict("bad", t.bad, t.badText)); return; }
    if (!(window.crypto && crypto.subtle && typeof BigInt === "function")) { out.appendChild(verdict("none", t.none, t.unsupported)); return; }
    var signed = data.slice(0, 87), sig = data.slice(87, 151), pub = data.slice(54, 87);
    var valid = false;
    try {
      var key = await crypto.subtle.importKey("raw", decompress(pub), { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
      valid = await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, sig, signed);
    } catch (e) { valid = false; }
    out.appendChild(valid ? verdict("ok", t.ok, t.okText) : verdict("bad", t.bad, t.badText));
    if (!valid) return;

    var flags = data[1], time = u32(data, 2), lat = i32(data, 6) / 1e7, lon = i32(data, 10) / 1e7;
    var acc = u16(data, 14), heading = u16(data, 18);
    var date = new Date(time * 1000);
    var dl = el("dl");
    row(dl, t.time, date.toLocaleString(lang === "ar" ? "ar-MA-u-nu-latn" : lang, { dateStyle: "full", timeStyle: "medium" }) + "\n" + date.toISOString().replace("T", " ").slice(0, 19) + " " + t.utc);
    if (flags & 8) {
      row(dl, t.position, t.noLoc);
    } else {
      var box = el("div");
      box.appendChild(el("div", "mono", deg(lat, "N", "S") + ", " + deg(lon, "E", "W") + (acc !== 0xffff ? "  ±" + acc + " m (" + t.accuracy + ")" : "")));
      var a = el("a", null, t.map); a.href = "https://www.openstreetmap.org/?mlat=" + lat + "&mlon=" + lon + "#map=18/" + lat + "/" + lon; a.rel = "noopener"; a.target = "_blank";
      box.appendChild(a);
      if (flags & 4) box.appendChild(el("div", "tag", t.manual));
      row(dl, t.position, box);
    }
    if (heading !== 0xffff) row(dl, t.heading, (heading / 10).toFixed(0) + "°");
    var sigHash = new Uint8Array(await crypto.subtle.digest("SHA-256", sig));
    var keyHash = new Uint8Array(await crypto.subtle.digest("SHA-256", pub));
    row(dl, t.code, group(base32(sigHash.slice(0, 5)), 4), true);
    row(dl, t.device, group(base32(keyHash.slice(0, 6)).slice(0, 10), 5), true);
    if (flags & 2) { var v = el("span", "tag", t.video); row(dl, "", v); }
    out.appendChild(dl);
    document.getElementById("note").textContent = t.note;
  }
  out.appendChild(el("p", null, t.checking));
  run().then(function () { var first = out.firstChild; if (first && first.tagName === "P") out.removeChild(first); });
})();
</script>
</body>
</html>
